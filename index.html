<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Core SEO & Discovery Metadata -->
    <title>ExplaiNote AI — Simplify, Recall, Master</title>
    <meta name="description" content="Convert uploaded documents and pasted text into active-recall flashcards, simplified summaries, and customized quizzes instantly with ExplaiNote AI." />
    
    <!-- Open Graph Social Media Meta Tags (Required by Cloudflare Middleware) -->
    <meta property="og:title" content="ExplaiNote AI — Simplify, Recall, Master" />
    <meta property="og:description" content="Convert uploaded documents and pasted text into active-recall flashcards, simplified summaries, and customized quizzes instantly with ExplaiNote AI." />
    <meta property="og:type" content="website" />
    
    <!-- Icons & Manifest Configurations -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Performance & Font Preconnections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="google-site-verification" content="n9MHYKAU-zzOAu4wuWlWSO-QkDECAE1oUIvai4TrhLo" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [{
    "@type": "Question",
    "name": "How does Active Recall work?",
    "acceptedAnswer": {
      "@type": "Answer",
      "text": "Paste any study content — lecture notes, articles, or textbook passages — and our AI creates a Feynman-style simplified summary, flashcards with difficulty levels, key concepts, retrieval prompts, and section-by-section recall questions."
    }
  }, {
    "@type": "Question",
    "name": "What file formats does Document Quiz support?",
    "acceptedAnswer": {
      "@type": "Answer",
      "text": "We support PDF (.pdf), Word documents (.docx), and plain text (.txt) files. The AI extracts and analyzes the full text, then generates a hierarchical quiz covering every major concept from your document."
    }
  }]
}
</script>
  </body>
</html>
