<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Core SEO & Discovery Metadata -->
    <title>ExplaiNote AI — Simplify, Recall, Master</title>
    <meta name="description" content="Convert uploaded documents and pasted text into active-recall flashcards, simplified summaries, and customized quizzes instantly with ExplaiNote AI." />
    
    <!-- Open Graph Social Media Meta Tags (Required by Cloudflare Middleware) -->
    <meta property="og:title" content="ExplaiNote AI — Simplify, Recall, Master" />
    <meta property="og:description" content="Convert uploaded documents and pasted text into active-recall flashcards, simplified summaries, and customized quizzes instantly with ExplaiNote AI." />
    <meta property="og:type" content="website" />
    
    <!-- Icons & Manifest Configurations -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Performance & Font Preconnections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
